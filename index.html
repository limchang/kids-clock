<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="어린이 시계">
<title>어린이 시계</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bus" viewBox="0 0 24 24"><path d="M8 6v6M16 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></symbol>
    <symbol id="i-meal" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.650 1.650 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M8 10h8M8 18h8M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/><path d="M7 21h10M19.5 12 22 6M16.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.73 1.62M11.25 3c.27.1.8.53.74 1.36-.05.83-.93 1.2-.98 2.02-.06.78.33 1.24.72 1.62M6.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.74 1.62"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 10.5l-6.1 1.7L12 18l-1.9-5.8L4 10.5l6.1-1.7z"/><path d="M19 17v4M17 19h4M5 3v3M3.5 4.5h3"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.3 2.9A6 6 0 0 0 20 4v11a6 6 0 0 1-4.7.9C13 15 11 13 8 13a6 6 0 0 0-4 1.5"/></symbol>
  </defs>
</svg>

<div id="bg"><img id="bgA" alt=""><img id="bgB" alt=""></div>

<main id="app">
  <div id="clockWrap"><svg id="clock" viewBox="-100 -100 200 200" aria-label="아날로그 시계"></svg></div>
  <section id="info">
    <div class="card goalCard" id="mainCard">
      <div class="who"><span class="gbadge"><svg class="ic" id="aIcon"><use href="#i-bag"/></svg></span><span class="cap"><span id="aName"></span> <span class="at" id="aAt"></span></span></div>
      <svg id="goalClock" viewBox="-110 -110 220 220" aria-label="목표 시계"></svg>
      <div class="big" id="remain"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="card timerCard" id="timerCard">
      <svg id="timer" viewBox="-100 -100 200 200" aria-label="남은 시간"></svg>
      <div class="tside"><div id="tmTxt"></div><div id="tmBtns"></div></div>
    </div>
    <div class="card now" id="nowCard"><svg class="ic"><use href="#i-star"/></svg>지금은 <b id="nowTxt"></b><span class="hand"><svg class="ic"><use href="#i-hand"/></svg>바늘을 돌려 보세요</span></div>
    <div id="playBar" hidden>
      <button class="pbtn" id="undoBtn"><svg class="ic"><use href="#i-undo"/></svg>되돌리기</button>
      <button class="pbtn" id="nowBtn"><svg class="ic"><use href="#i-clock"/></svg>지금 시각</button>
      <button class="pbtn alt" id="setBtn"><svg class="ic"><use href="#i-flag"/></svg>알람 시각으로</button>
    </div>
    <div class="card" id="pickAlarm" hidden></div>
  </section>
</main>

<button id="gear" aria-label="설정 (길게 누르기)">
  <svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/></svg>
  <svg class="ic"><use href="#i-gear"/></svg>
</button>
<div id="soundHint"><svg class="ic"><use href="#i-sound"/></svg>화면을 한 번 눌러 주세요. 소리가 켜져요</div>
<div id="toast"></div>
<div id="flash"></div>

<div id="go" hidden>
  <div class="goRow"><svg class="ic spk"><use href="#i-sparkle"/></svg><svg class="ic goIcon" id="goIcon"><use href="#i-bus"/></svg><svg class="ic spk"><use href="#i-sparkle"/></svg></div>
  <div class="goText" id="goText">출발!</div>
  <div class="goSub" id="goSub">화면을 누르면 닫혀요</div>
</div>

<aside id="sheet" hidden>
  <header>
    <div class="seg" role="tablist">
      <button data-tab="alarms" aria-selected="true"><svg class="ic"><use href="#i-bell"/></svg>알람</button>
      <button data-tab="bgs"><svg class="ic"><use href="#i-image"/></svg>배경</button>
      <button data-tab="etc"><svg class="ic"><use href="#i-sliders"/></svg>기타</button>
    </div>
    <button class="iconbtn" id="closeSheet" aria-label="닫기"><svg class="ic"><use href="#i-x"/></svg></button>
  </header>
  <div class="pane" id="pane-alarms"></div>
  <div class="pane" id="pane-bgs" hidden></div>
  <div class="pane" id="pane-etc" hidden></div>
</aside>

<script src="app.js"></script>
</body>
</html>
